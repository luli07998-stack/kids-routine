<style>
:root{
  --ink:#3a2f1d; --ink2:#7c6b4c; --muted:#a8977a;
  --cream:#fffdf6; --card:#fffefb;
  --yellow:#ffd93d; --yellow-2:#ffe98a; --yellow-deep:#e6ae00; --yellow-soft:#fff6d2;
  --sky:#8ed8ff; --sky-deep:#2ea7e0; --sky-soft:#eaf7ff;
  --red:#ee4b3c; --red-deep:#c53024; --red-soft:#ffe9e6;
  --mint:#6fd6b8; --mint-soft:#e6fbf4;
  --purple:#a992ef; --purple-soft:#f1ecff;
  --line:rgba(120,90,30,.14);
  --shadow:0 14px 30px -22px rgba(120,80,10,.55), 0 2px 6px rgba(120,80,10,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  font-family:'Pretendard','Pretendard Variable','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Malgun Gothic','Noto Sans KR',sans-serif;
  color:var(--ink);letter-spacing:-.012em;-webkit-text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;
  height:100vh;height:100dvh;
  display:flex;flex-direction:column;
  padding:max(8px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
  background:
    radial-gradient(760px 420px at 8% -8%, #fff2b8 0%, rgba(255,242,184,0) 62%),
    radial-gradient(720px 420px at 96% -6%, #d9f1ff 0%, rgba(217,241,255,0) 60%),
    radial-gradient(900px 520px at 50% 118%, #ffe9cf 0%, rgba(255,233,207,0) 64%),
    linear-gradient(178deg,#fffdf4 0%,#fff9e8 52%,#fff4e3 100%);
}
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg svg{position:absolute}
.app{position:relative;z-index:1;flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,.9vh,10px);max-width:1460px;width:100%;margin:0 auto}
button{font-family:inherit;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.svg-sprite{position:absolute;width:0;height:0;overflow:hidden}

/* ---------------- header ---------------- */
.top{display:flex;align-items:center;gap:10px;flex:0 0 auto;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:5px clamp(12px,1.4vw,20px) 5px 7px;border-radius:999px;background:linear-gradient(120deg,#fffdf2,#fff3c8);border:2.5px solid #ffe188;box-shadow:var(--shadow);flex:0 0 auto}
.brand .mark{width:clamp(38px,5.6vh,54px);height:clamp(38px,5.6vh,54px);flex:0 0 auto;animation:bob 3.6s ease-in-out infinite}
.brand h1{margin:0;font-size:clamp(17px,2.6vh,27px);font-weight:900;letter-spacing:-.035em;white-space:nowrap;line-height:1.1}
.brand p{margin:1px 0 0;font-size:clamp(9px,1.4vh,13px);color:#a2790a;font-weight:800;white-space:nowrap;line-height:1.1}
.top .spacer{flex:1}
.clock{display:flex;flex-direction:column;align-items:flex-end;padding:3px clamp(10px,1.2vw,16px);border-radius:16px;background:rgba(255,253,246,.78);border:2px solid #ffeeb8;flex:0 0 auto}
.clock b{font-size:clamp(16px,2.5vh,25px);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.15}
.clock small{font-size:clamp(9px,1.3vh,12px);color:var(--ink2);font-weight:800;line-height:1.2}
/* cumulative sticker badge — always visible beside the clock */
.total-badge{flex:0 0 auto;display:flex;align-items:baseline;gap:clamp(3px,.45vw,7px);padding:clamp(3px,.7vh,8px) clamp(12px,1.5vw,20px);border-radius:999px;background:linear-gradient(150deg,#fffef8 0%,#fff9e4 58%,#fff1c9 100%);border:3px solid #ffd23f;box-shadow:0 4px 0 #e9a800,0 16px 26px -18px rgba(170,120,0,.8),inset 0 2px 0 #fff;position:relative;white-space:nowrap;transform-origin:50% 60%}
.total-badge::before{content:'';position:absolute;inset:2px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0) 42%);pointer-events:none}
.total-badge .tb-star{align-self:center;width:clamp(24px,3.6vh,38px);height:clamp(24px,3.6vh,38px);flex:0 0 auto;border-radius:50%;background:radial-gradient(circle at 38% 28%,#fffef8,#fff6d6);box-shadow:inset 0 0 0 2.5px #ffd23f,0 2px 5px -1px rgba(150,100,0,.3);display:grid;place-items:center;animation:bob 2.9s ease-in-out infinite;position:relative;z-index:1}
.total-badge .tb-star svg{width:74%;height:74%}
.total-badge .tb-label{font-size:clamp(10px,1.65vh,15px);font-weight:900;color:#a8562f;letter-spacing:-.02em;line-height:1;position:relative;z-index:1}
.total-badge b{font-size:clamp(26px,4.3vh,42px);font-weight:900;color:#c53024;line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.035em;text-shadow:0 1.5px 0 rgba(255,255,255,.95);position:relative;z-index:1}
.total-badge .tb-unit{font-size:clamp(11px,1.8vh,16px);font-weight:900;color:#a8562f;line-height:1;position:relative;z-index:1;margin-left:-1px}
.total-badge.bump{animation:tbBump .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes tbBump{0%{transform:scale(1)}30%{transform:scale(1.15) rotate(-2.5deg)}62%{transform:scale(.97) rotate(1deg)}100%{transform:scale(1) rotate(0)}}
.gear{width:clamp(36px,5.4vh,52px);height:clamp(36px,5.4vh,52px);border-radius:50%;border:2.5px solid #ffe188;background:#fffdf6;display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer;flex:0 0 auto;padding:0}
.gear svg{width:56%;height:56%;color:#8a6c1c}
.gear:active{transform:scale(.94)}

/* ---------------- word card ---------------- */
.wordcard{flex:0 0 auto;display:flex;align-items:center;gap:clamp(8px,1.3vw,18px);padding:clamp(6px,.9vh,10px) clamp(10px,1.4vw,18px);border-radius:26px;background:linear-gradient(112deg,#fffbe8 0%,#fffdf7 46%,#eef9ff 100%);border:3px solid #ffe08a;box-shadow:0 16px 34px -26px rgba(180,130,10,.7),inset 0 1px 0 #fff;position:relative;overflow:hidden;height:clamp(80px,12.2vh,116px)}
.wordcard::after{content:'';position:absolute;right:-46px;bottom:-76px;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,rgba(255,233,138,.5),transparent 70%);pointer-events:none}
.word-head{display:flex;flex-direction:column;gap:4px;flex:0 0 auto;position:relative;z-index:1}
.word-title{font-size:clamp(12px,1.8vh,16px);font-weight:900;color:#a2790a;letter-spacing:.01em;display:flex;align-items:center;gap:5px}
.word-title svg{width:1.15em;height:1.15em;color:#f0a800}
.stages{display:flex;gap:5px}
.stage{border:2px solid #ffd96e;background:#fff;border-radius:999px;padding:2px 9px;font-size:clamp(9px,1.45vh,13px);font-weight:900;color:#9a7413;cursor:pointer;line-height:1.35;letter-spacing:-.02em}
.stage.on{background:linear-gradient(160deg,#ffe15c,#ffc21f);color:#5a3c00;border-color:#e9a600;box-shadow:0 2.5px 0 #d99a00,0 6px 12px -6px rgba(200,140,0,.65)}
.word-main{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(6px,.9vw,14px);min-width:0;position:relative;z-index:1;cursor:pointer}
.word-hint{font-size:clamp(26px,5.4vh,46px);line-height:1;filter:drop-shadow(0 3px 3px rgba(120,80,0,.14));flex:0 0 auto}
.word-text{font-size:clamp(27px,5.5vh,56px);font-weight:900;letter-spacing:.01em;color:#42351d;white-space:nowrap;text-shadow:0 2px 0 #fff,0 4px 0 rgba(210,160,40,.16);line-height:1.1}
.word-text .dot{color:#dbb45c;font-weight:800;margin:0 .14em;font-size:.55em;vertical-align:.2em}
.word-actions{display:flex;align-items:center;gap:7px;flex:0 0 auto;position:relative;z-index:1}
.speak{width:clamp(38px,5.4vh,50px);height:clamp(38px,5.4vh,50px);border-radius:50%;border:2.5px solid #bfe6ff;background:linear-gradient(#f4fbff,#ddf2ff);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 3px 8px -3px rgba(40,140,190,.4)}
.speak svg{width:52%;height:52%;color:#1e86ba}
.speak:active{transform:scale(.93)}
.speak.off{opacity:.45}
.next{border:none;border-radius:999px;padding:0 clamp(11px,1.3vw,18px);height:clamp(34px,5vh,46px);background:linear-gradient(160deg,#ffd93d,#ffb800);color:#5a3c00;font-weight:900;font-size:clamp(11px,1.65vh,15px);display:flex;align-items:center;gap:5px;box-shadow:0 3.5px 0 #d99a00,0 10px 18px -10px rgba(200,140,0,.9);cursor:pointer;white-space:nowrap;letter-spacing:-.02em}
.next svg{width:1.05em;height:1.05em}
.next:active{transform:translateY(2px);box-shadow:0 1.5px 0 #d99a00}
.word-no{font-size:clamp(9px,1.3vh,12px);font-weight:900;color:#b09a6e;min-width:32px;text-align:center}

/* ---------------- sticker board ---------------- */
.board{flex:0 0 auto;position:relative;height:clamp(110px,16.6vh,158px);border-radius:28px;padding:clamp(4px,.7vh,8px) clamp(10px,1.4vw,18px) clamp(5px,.9vh,10px);background:linear-gradient(150deg,#fff8f4,#fffdf8 42%,#fff7e7);border:3px solid #ffc9c0;box-shadow:0 18px 36px -28px rgba(190,60,40,.55),inset 0 1px 0 #fff;display:flex;flex-direction:column;gap:1px;overflow:hidden;transition:border-color .3s,background .4s}
.board-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 6px;flex:0 0 auto}
.board-title{font-size:clamp(10px,1.6vh,14px);font-weight:900;color:#b8542f;display:flex;align-items:center;gap:6px;letter-spacing:.01em}
.board-title svg{width:1.25em;height:1.25em;color:#ee4b3c}
.board-count{font-size:clamp(10px,1.6vh,14px);font-weight:800;color:#8a6a3c;display:flex;align-items:baseline;gap:4px}
.board-count b{font-size:1.45em;color:#c53024;font-weight:900;font-variant-numeric:tabular-nums}
.board-msg{font-size:clamp(10px,1.55vh,13.5px);font-weight:900;color:#c53024;display:none;align-items:center;gap:5px}
.board.done{border-color:#ffd23f;background:linear-gradient(150deg,#fffbee,#fffdf6 40%,#f0fbff)}
.board.done .board-msg{display:flex;animation:bob 1.8s ease-in-out infinite}
.board.done .board-count{display:none}
.slots{flex:1;display:flex;align-items:center;justify-content:center;gap:clamp(4px,.7vw,11px);min-height:0;padding:0 2px}
.slot{position:relative;flex:1 1 0;min-width:0;max-width:clamp(58px,11.4vh,102px);aspect-ratio:1;max-height:100%;display:grid;place-items:center;border-radius:50%}
.slot .ring{position:absolute;inset:0;border-radius:50%;border:3px dashed #e9c6b2;background:radial-gradient(circle at 50% 26%,#fffefb,#fff6ee 78%)}
.slot .mini{position:relative;width:44%;height:44%;opacity:.4;display:grid;place-items:center}
.slot .mini svg{width:100%;height:100%}
.slot .sticker{position:absolute;inset:-1%;display:grid;place-items:center;opacity:0;transform:scale(.2) rotate(-24deg)}
.slot .sticker .disc{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 34% 26%,#fffef8,var(--ssoft,#fff2cc));box-shadow:inset 0 0 0 3px var(--scol,#ffd93d),0 6px 12px -6px rgba(120,80,10,.45)}
.slot .sticker svg.seal{position:relative;width:76%;height:76%}
.slot.done .ring,.slot.done .mini{display:none}
.slot.done .sticker{opacity:1;transform:scale(1) rotate(0)}
.slot.just .sticker{animation:bob .5s ease-out}
.slot.just .sticker svg.seal{animation:stampIn .6s cubic-bezier(.2,1.6,.45,1) both}

/* ---------------- columns ---------------- */
.cols{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,.84fr) minmax(0,1.62fr) minmax(0,1fr);gap:clamp(8px,1vw,14px)}
.col{display:flex;flex-direction:column;gap:clamp(7px,.95vw,12px);min-height:0;min-width:0}
.col > .rcard,.col > .card-empty{flex:1 1 auto;min-height:0}
.study{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:clamp(7px,.95vw,12px)}
.card-empty{flex:1;display:grid;place-items:center;border:3px dashed #e8dcc4;border-radius:26px;color:#b9a888;font-size:13px;font-weight:800;background:rgba(255,253,246,.6);text-align:center;padding:10px}

/* ---------------- routine card ---------------- */
.rcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(1px,.4vh,5px);padding:clamp(6px,.9vh,12px) clamp(6px,.8vw,12px);border-radius:26px;--isz:clamp(52px,9.8vh,80px);background:linear-gradient(168deg,#fffefb 0%,#fffdf6 58%,var(--cs,#fff8e4) 100%);border:2.5px solid var(--cl,#f0dcae);box-shadow:0 14px 28px -20px rgba(120,80,10,.5),0 2px 5px rgba(120,80,10,.05),inset 0 1px 0 #fff;cursor:pointer;overflow:hidden;min-height:0;transition:transform .1s ease,box-shadow .18s ease,border-color .2s;user-select:none}
.rcard::before{content:'';position:absolute;left:-34%;top:-64%;width:130%;height:130%;border-radius:50%;background:radial-gradient(circle at 34% 34%,var(--csoft,#fff2c0),transparent 70%);opacity:.5;pointer-events:none}
.rcard:active{transform:scale(.972)}
.rcard .ico-wrap{position:relative;flex:1 1 auto;min-height:0;width:100%;display:grid;place-items:center}
.rcard .ico{width:min(100%,var(--isz,60px));height:auto;max-height:100%;display:block;filter:drop-shadow(0 5px 6px rgba(120,80,20,.15));transition:opacity .25s,filter .25s}
.rcard .lbl{font-size:clamp(13px,2.05vh,21px);font-weight:900;letter-spacing:-.035em;text-align:center;line-height:1.12;z-index:1;transition:color .2s}
.rcard .sub{font-size:clamp(8px,1.3vh,12px);font-weight:800;color:var(--ink2);opacity:.72;z-index:1;letter-spacing:-.02em;line-height:1.1}
.rcard .stamp{position:absolute;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;z-index:2}
.rcard .stamp svg{width:min(100%,calc(var(--isz,60px) * 1.06));height:auto;aspect-ratio:1}
.rcard .tick{position:absolute;right:7%;top:7%;width:clamp(20px,2.9vh,26px);height:clamp(20px,2.9vh,26px);border-radius:50%;background:linear-gradient(160deg,#7ee2c2,#37bf9a);display:grid;place-items:center;opacity:0;transform:scale(.4);transition:.2s;z-index:3;box-shadow:0 3px 8px -3px rgba(30,140,110,.8)}
.rcard .tick svg{width:62%;height:62%;color:#fff}
.rcard.done{border-color:var(--c,#ffd36e);background:linear-gradient(168deg,#fffdf1,#fff7db 62%,var(--csoft,#fff0c6) 100%)}
.rcard.done .ico{opacity:0}
.rcard.done .stamp{opacity:1}
.rcard.done .stamp svg{filter:drop-shadow(0 8px 10px rgba(120,80,10,.18))}
.rcard.just .stamp svg{animation:stampIn .55s cubic-bezier(.2,1.6,.45,1) both}
.rcard.done .tick{opacity:1;transform:scale(1)}
.rcard.big{--isz:clamp(124px,26vh,240px);gap:clamp(4px,1vh,12px)}
.rcard.big .ico-wrap{flex:0 0 auto}
.rcard.big .lbl{font-size:clamp(18px,2.9vh,30px)}
.rcard.big .sub{font-size:clamp(10px,1.5vh,14px)}
.rcard.big .stamp svg{width:min(100%,calc(var(--isz) * 1.04))}

/* ---------------- TV reward ---------------- */
.tv{flex:0 0 auto;display:flex;align-items:center;gap:clamp(8px,1vw,16px);padding:clamp(8px,1.2vh,14px) clamp(11px,1.4vw,20px);border-radius:26px;background:linear-gradient(118deg,#eefaff,#fbfeff 52%,#fff8e9);border:2.5px solid #bfe6ff;box-shadow:0 14px 28px -20px rgba(30,130,180,.45),inset 0 1px 0 #fff;position:relative;overflow:hidden;height:clamp(92px,17vh,150px);transition:border-color .3s,background .4s}
.tv .ico{width:clamp(32px,6.2vh,58px);height:auto;flex:0 0 auto;filter:drop-shadow(0 5px 6px rgba(30,130,180,.18))}
.tv-left{display:flex;align-items:center;gap:clamp(7px,1vw,12px);flex:1;min-width:0}
.tv-name{font-size:clamp(14px,2.2vh,23px);font-weight:900;letter-spacing:-.035em;white-space:nowrap;line-height:1.1}
.tv-sub{font-size:clamp(9px,1.4vh,13px);font-weight:800;color:#3d7f9e;margin-top:3px;line-height:1.2}
.tv-timer{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:0 0 auto}
.tv-time{font-size:clamp(21px,4.1vh,38px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:#1f7fa8;line-height:1;text-shadow:0 2px 0 #fff}
.tv-time.low{color:#d1452f;animation:pulse 1s ease-in-out infinite}
.tv-bar{width:clamp(84px,11vw,150px);height:6px;border-radius:99px;background:#dff0f8;overflow:hidden}
.tv-bar i{display:block;height:100%;background:linear-gradient(90deg,#8ed8ff,#2ea7e0);border-radius:99px;transition:width .4s linear}
.tv-btns{display:flex;gap:5px;margin-top:1px}
.tbtn{width:clamp(30px,4.5vh,42px);height:clamp(30px,4.5vh,42px);border-radius:50%;border:2px solid #cfe9f6;background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 2px 6px -3px rgba(30,130,180,.5)}
.tbtn svg{width:44%;height:44%;color:#1f7fa8}
.tbtn.primary{background:linear-gradient(#ffe15c,#ffc21f);border-color:#e9a600;box-shadow:0 3px 0 #d99a00}
.tbtn.primary svg{color:#5a3c00}
.tbtn:active{transform:translateY(1px)}
.tbtn:disabled{opacity:.35;cursor:default;box-shadow:none}
.tv.locked{background:linear-gradient(118deg,#f9f6ef,#fdfbf7);border-color:#e9dfcc}
.tv.locked .tv-timer{display:none}
.tv.locked .tv-sub{color:#a89a80}
.tv-lock{display:none;flex:0 0 auto;align-items:center;gap:7px;font-size:clamp(10px,1.55vh,13.5px);font-weight:900;color:#8d7d64;background:#fffdf6;border:2.5px dashed #e3d7c0;border-radius:16px;padding:8px 13px;max-width:54%;line-height:1.3;letter-spacing:-.02em;text-align:left}
.tv-lock svg{width:1.35em;height:1.35em;flex:0 0 auto;color:#b9a98e}
.tv.locked .tv-lock{display:flex}
.tv.unlock{animation:unlockPop .7s ease}

/* ---------------- settings ---------------- */
.modal{position:fixed;inset:0;z-index:50;background:rgba(60,40,10,.34);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(3px)}
.sheet{width:min(540px,94vw);max-height:88vh;background:#fffdf7;border-radius:28px;box-shadow:0 30px 70px -30px rgba(60,40,0,.6);border:3px solid #ffe08a;display:flex;flex-direction:column;overflow:hidden}
.sheet.wide{width:min(720px,94vw)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:2px solid #fff1c9;background:linear-gradient(120deg,#fffbe6,#fff7e0);flex:0 0 auto}
.sheet-head h2{margin:0;font-size:19px;font-weight:900;letter-spacing:-.03em}
.x{width:36px;height:36px;border-radius:50%;border:2px solid #f0dcae;background:#fff;font-size:15px;font-weight:900;color:#8a6c1c;cursor:pointer;line-height:1}
.rows{padding:2px 18px;overflow:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 0;border-bottom:1px dashed #efe4cd}
.row:last-child{border-bottom:0}
.row .txt b{font-size:15px;letter-spacing:-.02em}
.row .txt small{display:block;font-size:12px;color:#9a8a72;margin-top:2px}
.btn{border:2px solid #f0dcae;background:#fff;border-radius:14px;padding:8px 14px;font-size:13.5px;font-weight:900;color:#6b5733;cursor:pointer;white-space:nowrap;letter-spacing:-.02em}
.btn.primary{background:linear-gradient(#ffd93d,#ffb800);border-color:#e9a600;color:#5a3c00}
.btn.ghost{background:#fffdf5}
.adj{display:flex;align-items:center;gap:7px}
.adj b{min-width:44px;text-align:center;font-size:19px;color:#c53024;font-variant-numeric:tabular-nums}
.mini{width:34px;height:34px;border-radius:50%;border:2px solid #f0dcae;background:#fff;font-size:17px;font-weight:900;color:#8a6c1c;cursor:pointer;line-height:1;padding:0}
.sheet-foot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:2px solid #fff1c9;background:#fffdf3;flex:0 0 auto}
.sheet-foot.note{justify-content:center;font-size:11.5px;color:#a8977a;font-weight:700}
.edit-list{padding:12px 16px;overflow:auto;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.erow{display:flex;gap:7px;align-items:center}
.erow input{flex:1;min-width:0;border:2px solid #efe0bf;border-radius:12px;padding:9px 12px;font-family:inherit;font-size:14px;font-weight:800;color:#3a2f1d;background:#fff;-webkit-user-select:text;user-select:text}
.erow select{border:2px solid #efe0bf;border-radius:12px;padding:9px 6px;font-family:inherit;font-size:12.5px;font-weight:800;background:#fff;color:#6b5733}
.erow .del{width:36px;height:36px;border-radius:50%;border:2px solid #ffd0c8;background:#fff5f2;color:#d1452f;cursor:pointer;font-size:14px;line-height:1;padding:0;display:grid;place-items:center}
.erow .del svg{width:16px;height:16px;color:#d1452f;display:block}
.edit-note{font-size:12px;color:#9a8a72;font-weight:700;margin:0 2px 2px;line-height:1.5}

/* ---------------- toast & fx ---------------- */
.toast{position:fixed;left:50%;top:max(9px,env(safe-area-inset-top));transform:translate(-50%,-12px);background:rgba(58,47,29,.95);color:#fff;padding:9px 20px;border-radius:99px;font-size:14px;font-weight:800;opacity:0;transition:opacity .25s,transform .25s;z-index:90;pointer-events:none;white-space:nowrap;box-shadow:0 12px 30px -12px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.spark{position:absolute;border-radius:50%;animation:spark .75s ease-out forwards}
.burst-txt{position:absolute;font-size:20px;font-weight:900;color:#ee4b3c;text-shadow:0 2px 0 #fff,0 0 10px rgba(255,255,255,.9);animation:burstTxt .9s ease-out forwards;white-space:nowrap;transform:translate(-50%,-50%)}
.burst-txt.gold{color:#f0a800}

@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes stampIn{0%{transform:scale(2.2) rotate(-22deg);opacity:0}55%{transform:scale(.92) rotate(3deg);opacity:1}75%{transform:scale(1.06) rotate(-2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes slotPop{0%{transform:scale(1)}45%{transform:scale(1.16)}100%{transform:scale(1)}}
@keyframes spark{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@keyframes burstTxt{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}30%{transform:translate(-50%,-70%) scale(1.15);opacity:1}100%{transform:translate(-50%,-160%) scale(1);opacity:0}}
@keyframes unlockPop{0%{transform:scale(1)}40%{transform:scale(1.03)}70%{transform:scale(.995)}100%{transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

@media (max-width:900px){
  .brand p{display:none}
}
@media (max-width:820px){
  .total-badge{padding:3px 11px;border-width:2px;gap:3px;box-shadow:0 3px 0 #e9a800,0 12px 20px -16px rgba(170,120,0,.8),inset 0 1.5px 0 #fff}
  .total-badge .tb-label{display:none}
  .total-badge .tb-star{width:24px;height:24px}
}
@media (max-width:560px){
  .top{gap:6px}
  .brand{padding:4px 9px 4px 5px;gap:6px}
  .brand .mark{width:30px;height:30px}
  .brand h1{font-size:15px}
  .clock{padding:2px 8px}
  .clock b{font-size:14px}
  .clock small{display:none}
  .gear{width:34px;height:34px}
  .total-badge{padding:2px 9px;gap:2px}
  .total-badge .tb-star{width:22px;height:22px}
  .total-badge b{font-size:23px}
  .total-badge .tb-unit{font-size:11px}
}
@media (max-width:400px){
  .top{gap:5px}
  .brand{padding:3px 8px 3px 4px;gap:5px}
  .brand .mark{width:28px;height:28px}
  .brand h1{font-size:14px}
  .clock b{font-size:13px}
  .gear{width:32px;height:32px}
  .total-badge{padding:2px 8px}
  .total-badge b{font-size:21px}
}
@media (max-width:340px){
  .clock{display:none}
}
@media (orientation:portrait){
  html,body{overflow:auto;height:auto}
  body{min-height:100dvh;padding-bottom:14px}
  .app{min-height:0}
  .wordcard{height:auto;flex-wrap:wrap;justify-content:center}
  .word-head{flex-direction:row;align-items:center;gap:8px}
  .board{height:auto;padding-bottom:10px}
  .slots{min-height:62px}
  .slot{max-width:62px}
  .cols{grid-template-columns:1fr;grid-auto-rows:minmax(150px,auto)}
  .study{grid-auto-rows:minmax(130px,auto)}
  .rcard{min-height:120px}
  .tv{height:auto;flex-wrap:wrap}
  .sheet{max-height:92vh}
}

  /* ================= state ================= */
  var today = '';
  var S = { v: 1, date: '', checks: {}, total: 0, timer: { left: TIMER_TOTAL, running: false, endsAt: 0 }, word: { stage: 1, idx: 0 }, items: null, party: '' };
  var memoryOnly = false;

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function cloneItem(it) { return { id: it.id, group: it.group, label: it.label, sub: it.sub, icon: it.icon }; }
  function defaultItems() { return DEFAULT_ITEMS.map(cloneItem); }

  function normalizeItems(arr) {
    if (!Array.isArray(arr)) return null;
    var out = [], seen = {};
    for (var i = 0; i < arr.length && out.length < LIMIT; i++) {
      var it = arr[i];
      if (!it || typeof it.label !== 'string') continue;
      var label = it.label.replace(/\s+/g, ' ').trim().slice(0, LABEL_MAX);
      if (!label) continue;
      var group = GROUP_ORDER.indexOf(it.group) >= 0 ? it.group : 'study';
      var id = (typeof it.id === 'string' && it.id && !seen[it.id]) ? it.id : 'x' + (Date.now().toString(36)) + out.length;
      seen[id] = 1;
      var icon = ICONS.indexOf(it.icon) >= 0 ? it.icon : defaultIcon(group);
      out.push({ id: id, group: group, label: label, sub: typeof it.sub === 'string' ? it.sub.slice(0, 8) : '', icon: icon });
    }
    return out.length ? out : null;
  }
  function defaultIcon(group) {
    if (group === 'vit') return 'ic-pill';
    if (group === 'ready') return 'ic-book';
    return 'ic-abc';
  }

  function load() {
    var raw = null;
    try { raw = window.localStorage.getItem(KEY); } catch (e) { memoryOnly = true; }
    if (raw) {
      try {
        var p = JSON.parse(raw);
        if (p && typeof p === 'object') {
          if (p.checks && typeof p.checks === 'object') S.checks = p.checks;
          if (typeof p.total === 'number' && isFinite(p.total)) S.total = Math.max(0, Math.round(p.total));
          if (p.timer && typeof p.timer === 'object') {
            S.timer.left = clamp(Math.round(Number(p.timer.left) || 0), 0, TIMER_TOTAL);
            S.timer.running = !!p.timer.running && Number(p.timer.endsAt) > Date.now();
            S.timer.endsAt = S.timer.running ? Number(p.timer.endsAt) : 0;
          }
          if (p.word && typeof p.word === 'object') {
            S.word.stage = clamp(Math.round(Number(p.word.stage) || 1), 1, 3);
            S.word.idx = Math.max(0, Math.round(Number(p.word.idx) || 0));
          }
          if (typeof p.date === 'string') S.date = p.date;
          if (typeof p.party === 'string') S.party = p.party;
          S.items = normalizeItems(p.items);
        }
      } catch (e) { /* keep defaults */ }
    }
    if (!S.items) S.items = defaultItems();
    today = todayKey();
    if (S.date !== today) {
      S.date = today; S.checks = {}; S.timer = { left: TIMER_TOTAL, running: false, endsAt: 0 }; S.party = '';
      saveNow();
    }
    pruneChecks();
  }
  function clamp(n, a, b) { return n < a ? a : (n > b ? b : n); }

  function pruneChecks() {
    var keep = {}, n = 0;
    S.items.forEach(function (it) { if (S.checks[it.id]) { keep[it.id] = true; n++; } });
    S.checks = keep;
    if (S.total < n) S.total = n;
  }

  var saveTimer = 0, saving = false;
  function save() {
    if (saveTimer) return;

  }
  function saveNow() {
    if (saving) return;
    saving = true;
    try {
      window.localStorage.setItem(KEY, JSON.stringify({
        v: 1, date: S.date, checks: S.checks, total: S.total, timer: S.timer, word: S.word, items: S.items, party: S.party
      }));
    } catch (e) { memoryOnly = true; }
    saving = false;
  }

  function checkDay() {

  /* ================= helpers ================= */
  function itemsOf(g) { return S.items.filter(function (it) { return it.group === g; }); }
  function findItem(id) {
    for (var i = 0; i < S.items.length; i++) if (S.items[i].id === id) return S.items[i];
    return null;
  }
  function checkedCount() { return Object.keys(S.checks).length; }
  function allDone() { return S.items.length > 0 && checkedCount() === S.items.length; }
  function studyDone() {
    var s = itemsOf('study');
    if (!s.length) return false;
    for (var i = 0; i < s.length; i++) if (!S.checks[s[i].id]) return false;
    return true;
  }
  function sealFor(it) {
    var idx = S.items.indexOf(it);
    return SEALS[(idx < 0 ? 0 : idx) % SEALS.length];
  }
  function accentFor(it) {
    if (it.group === 'vit') return ACCENT.vit;
    var arr = ACCENT[it.group] || ACCENT.study;

  /* ================= sound ================= */
  var actx = null;
  function popSound(up) {
    try {
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      if (!actx) actx = new Ctx();
      if (actx.state === 'suspended' && actx.resume) actx.resume();
      var t = actx.currentTime;
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(up ? 620 : 460, t);
      o.frequency.exponentialRampToValueAtTime(up ? 1180 : 260, t + 0.11);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + 0.25);
    } catch (e) { /* sound is optional */ }
  }

  /* ================= fx ================= */
  var FX_COLORS = ['#ffd93d', '#ee4b3c', '#8ed8ff', '#7ddcc0', '#ffb3c7', '#f0a800'];
  function spawnSpark(x, y, dx, dy, color, size) {
    var d = document.createElement('i');
    d.className = 'spark';
    d.style.left = x + 'px';
    d.style.top = y + 'px';
    d.style.width = size + 'px';
    d.style.height = size + 'px';
    d.style.background = color;
    d.style.setProperty('--dx', dx + 'px');
    d.style.setProperty('--dy', dy + 'px');
    D.fx.appendChild(d);
    window.setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 800);
  }
  function burst(rect, big) {
    var cx = rect.left + rect.width / 2;
    var cy = rect.top + rect.height / 2;
    var n = big ? 18 : 10;
    for (var i = 0; i < n; i++) {
      var a = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      var dist = (big ? 80 : 46) + Math.random() * (big ? 70 : 30);
      spawnSpark(cx, cy, Math.cos(a) * dist, Math.sin(a) * dist,
        FX_COLORS[i % FX_COLORS.length], 5 + Math.random() * (big ? 9 : 5));
    }
    var t = document.createElement('span');
    t.className = 'burst-txt' + (big ? ' gold' : '');
    t.textContent = big ? '짠! ⚡' : '팡!';
    t.style.left = cx + 'px';
    t.style.top = cy + 'px';
    D.fx.appendChild(t);
    window.setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 950);
  }

  function toggle(id, rect) {
    var it = findItem(id);

      delete S.checks[id];
      S.total = Math.max(0, S.total - 1);
      S.party = '';

      renderAll();
      popSound(false);

      S.checks[id] = true;

  /* ================= word card ================= */
  var canSpeak = ('speechSynthesis' in window) && (typeof window.SpeechSynthesisUtterance === 'function');

      var vs = window.speechSynthesis.getVoices() || [];
      for (var i = 0; i < vs.length; i++) {

      }

  }
  function speak(text) {
    if (!canSpeak) { toast('이 화면에서는 소리를 낼 수 없어요'); return; }
    try {
      window.speechSynthesis.cancel();
      var u = new window.SpeechSynthesisUtterance(text);
      u.lang = 'ko-KR';
      u.rate = 0.78;
      u.pitch = 1.15;
      if (koVoice) u.voice = koVoice;
      window.speechSynthesis.speak(u);
    } catch (e) { toast('읽어주기를 쓸 수 없어요'); }
  }
  function currentWord() {
    var st = STAGES[clamp(S.word.stage, 1, 3) - 1];
    var idx = S.word.idx % st.words.length;
    return st.words[idx];
  }
  function paintWord() {
    var st = STAGES[clamp(S.word.stage, 1, 3) - 1];
    var idx = S.word.idx % st.words.length;
    var w = st.words[idx];
    D.wordHint.textContent = w.e;
    D.wordText.innerHTML = w.w.split('').map(function (ch) { return '<span>' + esc(ch) + '</span>'; }).join('<span class="dot">·</span>');
    D.wordNo.textContent = (idx + 1) + ' / ' + st.words.length;
    var btns = D.stages.querySelectorAll('.stage');
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.toggle('on', Number(btns[i].getAttribute('data-stage')) === st.n);
      btns[i].title = STAGES[Number(btns[i].getAttribute('data-stage')) - 1].tip;
    }
  }
  function nextWord(talk) {
    var st = STAGES[clamp(S.word.stage, 1, 3) - 1];
    S.word.idx = (S.word.idx + 1) % st.words.length;
    save();
    paintWord();
    if (talk) speak(currentWord().w);
  }

  /* ================= clock ================= */
  function paintClock() {
    var d = new Date();
    var h = d.getHours(), m = d.getMinutes();
    var ap = h < 12 ? '오전' : '오후';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    D.clockHM.textContent = ap + ' ' + h12 + ':' + pad2(m);
    D.clockDate.textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + WD[d.getDay()] + ')';
  }

  /* ================= settings ================= */
  function openSettings() {
    D.adjVal.textContent = String(S.total);
    D.settingsModal.hidden = false;
  }
  function closeModals() {
    D.settingsModal.hidden = true;
    D.editorModal.hidden = true;
  }
  function adjustTotal(delta) {
    var floor = checkedCount();
    S.total = Math.max(floor, S.total + delta);
    D.adjVal.textContent = String(S.total);
    paintTotals();
    saveNow();
  }
  function doResetToday() {
    if (!window.confirm('오늘 찍은 스티커를 모두 지울까요?')) return;
    var n = checkedCount();
    S.checks = {};
    S.total = Math.max(0, S.total - n);
    S.timer = { left: TIMER_TOTAL, running: false, endsAt: 0 };
    S.party = '';
    saveNow();
    renderAll();
    D.adjVal.textContent = String(S.total);
    toast('오늘 루틴을 처음으로 돌렸어요');
  }
  function doResetTotal() {
    if (!window.confirm('누적 스티커를 처음부터 다시 셀까요?\n(오늘 찍은 스티커만 남아요)')) return;
    S.total = checkedCount();
    saveNow();
    paintTotals();
    D.adjVal.textContent = String(S.total);
    toast('누적 스티커를 다시 셌어요');
  }

  /* ----- editor ----- */
  function editorRow(it) {
    var row = document.createElement('div');
    row.className = 'erow';
    row.innerHTML =
      '<input type="text" maxlength="' + LABEL_MAX + '" aria-label="항목 이름" />' +
      '<select aria-label="종류">' +
        GROUP_ORDER.map(function (g) { return '<option value="' + g + '">' + GROUP_NAME[g] + '</option>'; }).join('') +
      '</select>' +
      '<button class="del" type="button" aria-label="삭제"><svg viewBox="0 0 24 24" width="16" height="16"><use href="#ic-trash"/></svg></button>';
    row.querySelector('input').value = it ? it.label : '';
    row.querySelector('select').value = it ? it.group : 'study';
    if (it) row.setAttribute('data-id', it.id), row.setAttribute('data-icon', it.icon), row.setAttribute('data-sub', it.sub || '');
    row.querySelector('.del').addEventListener('click', function () {
      if (D.editorList.children.length <= 1) { toast('항목은 하나 이상 있어야 해요'); return; }
      row.parentNode.removeChild(row);
    });
    return row;
  }
  function openEditor() {
    D.editorList.innerHTML = '';
    S.items.forEach(function (it) { D.editorList.appendChild(editorRow(it)); });
    D.editorModal.hidden = false;
  }
  function addEditorRow() {
    if (D.editorList.children.length >= LIMIT) { toast('항목은 ' + LIMIT + '개까지 넣을 수 있어요'); return; }
    var row = editorRow(null);
    D.editorList.appendChild(row);
    row.querySelector('input').focus();
    D.editorList.scrollTop = D.editorList.scrollHeight;
  }
  function saveEditor() {
    var rows = D.editorList.querySelectorAll('.erow');
    var out = [], used = {};
    for (var i = 0; i < rows.length; i++) {
      var label = rows[i].querySelector('input').value.replace(/\s+/g, ' ').trim().slice(0, LABEL_MAX);
      if (!label) continue;
      var group = rows[i].querySelector('select').value;
      if (GROUP_ORDER.indexOf(group) < 0) group = 'study';
      var id = rows[i].getAttribute('data-id');
      if (!id || used[id]) id = 'n' + Date.now().toString(36) + i;
      used[id] = 1;
      var icon = rows[i].getAttribute('data-icon');
      if (ICONS.indexOf(icon) < 0) icon = defaultIcon(group);
      out.push({ id: id, group: group, label: label, sub: rows[i].getAttribute('data-sub') || '', icon: icon });
    }
    if (!out.length) { toast('이름을 하나 이상 적어 주세요'); return; }
    S.items = out;
    pruneChecks();
    saveNow();
    renderAll();
    closeModals();
    toast('루틴 항목을 저장했어요');
  }

  /* ================= events ================= */
  function bind() {
    [D.colVit, D.colStudy, D.colReady].forEach(function (col) {
      col.addEventListener('click', function (ev) {
        var card = ev.target.closest ? ev.target.closest('.rcard') : null;
        if (!card) return;
        var rect = card.getBoundingClientRect();
        toggle(card.getAttribute('data-id'), rect);
      });
    });

    D.gearBtn.addEventListener('click', openSettings);
    byId('closeSettings').addEventListener('click', closeModals);
    byId('closeEditor').addEventListener('click', function () { D.editorModal.hidden = true; });
    byId('editorCancel').addEventListener('click', function () { D.editorModal.hidden = true; });
    byId('editorSave').addEventListener('click', saveEditor);
    byId('openEditor').addEventListener('click', openEditor);
    var addBtn = byId('editorAdd');
    if (addBtn) addBtn.addEventListener('click', addEditorRow);
    D.adjMinus.addEventListener('click', function () { adjustTotal(-1); });
    D.adjPlus.addEventListener('click', function () { adjustTotal(1); });
    D.resetToday.addEventListener('click', doResetToday);
    D.resetTotal.addEventListener('click', doResetTotal);

    D.timerStart.addEventListener('click', startTimer);
    D.timerPause.addEventListener('click', pauseTimer);
    D.timerReset.addEventListener('click', resetTimer);

    D.wordNext.addEventListener('click', function () { nextWord(true); });
    D.wordSpeak.addEventListener('click', function () { speak(currentWord().w); });
    document.querySelector('.word-main').addEventListener('click', function () { speak(currentWord().w); });
    D.stages.addEventListener('click', function (ev) {
      var b = ev.target.closest ? ev.target.closest('.stage') : null;
      if (!b) return;
      var n = Number(b.getAttribute('data-stage'));
      if (!n) return;
      S.word.stage = n;
      S.word.idx = 0;
      save();
      paintWord();
      toast(n + '단계 · ' + STAGES[n - 1].tip);
      speak(currentWord().w);
    });

    [D.settingsModal, D.editorModal].forEach(function (m) {
      m.addEventListener('click', function (ev) { if (ev.target === m) m.hidden = true; });
    });
    document.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') closeModals();
    });

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) { checkDay(); paintClock(); paintTimer(); }
    });
    window.addEventListener('focus', checkDay);
    window.addEventListener('pageshow', checkDay);

    if (canSpeak) {
      try { window.speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) { /* ignore */ }
      pickVoice();
    } else {
      D.wordSpeak.classList.add('off');
      D.wordSpeak.setAttribute('aria-disabled', 'true');
    }
  }

  /* ================= boot ================= */
  grabDom();
  load();
  today = todayKey();
  bind();
  renderAll();
  paintClock();

  window.setInterval(function () { paintClock(); tickTimer(); checkDay(); }, 1000);
  window.setInterval(function () { checkDay(); }, 15000);

  // element that shows a quiet note when storage is unavailable
  if (memoryOnly) window.setTimeout(function () { toast('저장 공간을 쓸 수 없어 이번 화면에서만 기억해요'); }, 1200);

})();
</script>
</body>
</html>
